<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RIFT TACTICS — Combat Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0e16;
    --panel:#181b28;
    --panel-light:#222639;
    --panel-border:#2f3348;
    --ember:#e2793d;
    --ember-dim:#8a4d29;
    --teal:#4fd1c0;
    --blood:#d2495a;
    --gold:#dcb35f;
    --text:#ece7da;
    --text-dim:#8d8aa0;
    --hp-good:#5fbf6a;
    --hp-mid:#dcb35f;
    --hp-low:#d2495a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, #241c2c 0%, transparent 55%),
      radial-gradient(ellipse at 50% 110%, #1a1420 0%, transparent 50%),
      var(--bg);
    min-height:100vh;
  }
  #app{max-width:520px;margin:0 auto;padding:14px 12px 40px;min-height:100vh;position:relative;}

  .title{
    font-family:'Cinzel',serif; font-weight:900; letter-spacing:0.14em; font-size:20px;
    text-align:center; color:var(--ember); text-shadow:0 0 18px rgba(226,121,61,0.35); margin:4px 0 2px;
  }
  .subtitle{
    text-align:center; font-size:10.5px; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--text-dim); margin-bottom:14px;
  }

  .rule{
    height:1px;
    background:linear-gradient(90deg, transparent, var(--panel-border) 20%, var(--panel-border) 80%, transparent);
    margin:12px 0;
  }

  /* ENEMY ROW */
  .enemy-row{display:flex; gap:8px; margin-bottom:10px;}
  .enemy-card{
    flex:1; background:var(--panel); border:1px solid var(--panel-border); border-radius:10px;
    padding:9px 7px 8px; text-align:center; position:relative;
    transition:transform .15s ease, box-shadow .15s ease, opacity .3s ease;
  }
  .enemy-card.targetable{cursor:pointer;}
  .enemy-card.targetable:active{transform:scale(0.96);}
  .enemy-card.dead{opacity:0.25; filter:grayscale(1);}
  .enemy-card.selected{border-color:var(--blood); box-shadow:0 0 0 1px var(--blood), 0 0 16px rgba(210,73,90,0.4);}
  .enemy-name{font-size:10px; font-weight:700; letter-spacing:0.02em; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .enemy-tag{font-size:8px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:5px;}
  .hpbar-wrap{height:6px; border-radius:4px; background:#0b0c13; overflow:hidden; border:1px solid #000; margin-top:4px;}
  .hpbar{height:100%; border-radius:4px; transition:width .4s cubic-bezier(.4,0,.2,1); background:var(--hp-good);}
  .hptext{font-family:'JetBrains Mono',monospace; font-size:8.5px; color:var(--text-dim); margin-top:2px;}
  .dmg-float{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px;
    color:var(--blood); text-shadow:0 0 8px rgba(0,0,0,0.8);
    animation:floatUp 0.9s ease-out forwards; pointer-events:none;
  }
  .dmg-float.crit{color:var(--gold); font-size:18px;}
  @keyframes floatUp{
    0%{opacity:0; transform:translate(-50%,4px) scale(0.8);}
    15%{opacity:1; transform:translate(-50%,-6px) scale(1.1);}
    100%{opacity:0; transform:translate(-50%,-34px) scale(1);}
  }

  /* ARENA — the shared 3D stage: dungeon backdrop + all six characters */
  .arena-wrap{
    position:relative; height:300px; border-radius:12px; overflow:hidden;
    border:1px solid var(--panel-border); background:#0b0910; margin-bottom:10px;
  }
  .arena-wrap canvas{display:block; width:100%!important; height:100%!important;}
  .arena-wrap::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 62%, transparent 45%, rgba(0,0,0,0.62) 100%);
  }

  /* LOG */
  .log-box{
    background:#0b0c13; border:1px solid var(--panel-border); border-radius:8px; padding:8px 10px;
    height:64px; overflow-y:auto; font-size:11px; color:var(--text-dim); line-height:1.55; margin-bottom:10px;
  }
  .log-box .entry{color:var(--text);}
  .log-box .entry b{color:var(--ember);}
  .log-box .entry.turn-marker{color:var(--teal); font-family:'Cinzel',serif; letter-spacing:0.08em; font-size:10px; text-transform:uppercase;}

  /* COMBO THREAD */
  .thread-wrap{background:var(--panel); border:1px solid var(--panel-border); border-radius:12px; padding:14px 12px 12px; margin-bottom:10px;}
  .thread-label{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .thread-label .who{font-family:'Cinzel',serif; font-weight:700; font-size:13px; color:var(--gold); letter-spacing:0.03em;}
  .thread-label .ap{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim);}
  .thread-line{display:flex; align-items:center; justify-content:center; min-height:44px; gap:6px; position:relative; margin-bottom:6px;}
  .thread-line::before{content:''; position:absolute; left:8%; right:8%; top:50%; height:1px; background:var(--panel-border); z-index:0;}
  .thread-bead{
    width:34px; height:34px; border-radius:50%; background:var(--panel-light); border:1px solid var(--panel-border);
    display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:var(--text-dim);
    position:relative; z-index:1; animation:beadIn .2s ease-out;
  }
  @keyframes beadIn{from{transform:scale(0.4); opacity:0;} to{transform:scale(1); opacity:1;}}
  .thread-bead.filled{background:var(--panel); border-color:var(--ember-dim); color:var(--ember);}
  .thread-empty{font-size:11px; color:var(--text-dim); font-style:italic; z-index:1; background:var(--panel); padding:0 6px;}
  .art-callout{
    text-align:center; min-height:20px; font-family:'Cinzel',serif; font-size:13px; font-weight:700;
    letter-spacing:0.05em; color:var(--gold); text-shadow:0 0 12px rgba(220,179,95,0.5); animation:artPop .35s ease-out;
  }
  @keyframes artPop{from{opacity:0; transform:translateY(4px) scale(0.9);} to{opacity:1; transform:translateY(0) scale(1);}}
  .art-hint{text-align:center; font-size:9.5px; color:var(--text-dim); min-height:14px;}

  /* DIRECTION PAD */
  .pad-grid{display:grid; grid-template-columns:repeat(3, 1fr); grid-template-rows:repeat(3, 1fr); gap:6px; max-width:220px; margin:6px auto 12px;}
  .pad-btn{
    aspect-ratio:1; background:var(--panel-light); border:1px solid var(--panel-border); border-radius:10px; color:var(--text);
    font-size:18px; display:flex; align-items:center; justify-content:center; user-select:none;
    transition:background .1s, transform .08s, border-color .1s;
  }
  .pad-btn:active{transform:scale(0.92); background:var(--ember-dim); border-color:var(--ember);}
  .pad-btn.high{grid-column:2; grid-row:1;}
  .pad-btn.left{grid-column:1; grid-row:2;}
  .pad-btn.right{grid-column:3; grid-row:2;}
  .pad-btn.low{grid-column:2; grid-row:3;}
  .pad-btn.center{grid-column:2; grid-row:2; background:transparent; border:1px dashed var(--panel-border); color:var(--text-dim); font-family:'JetBrains Mono',monospace; font-size:9px;}

  .action-row{display:flex; gap:8px; margin-bottom:4px;}
  .btn{
    flex:1; padding:11px 6px; border-radius:8px; border:1px solid var(--panel-border); background:var(--panel-light);
    color:var(--text); font-family:'Inter',sans-serif; font-weight:600; font-size:12px; letter-spacing:0.02em;
    text-transform:uppercase; text-align:center;
  }
  .btn:active{transform:scale(0.97);}
  .btn.primary{background:linear-gradient(180deg, var(--ember), var(--ember-dim)); border-color:var(--ember); color:#1a0f06;}
  .btn.ghost{background:transparent; color:var(--text-dim);}
  .btn.guard{background:var(--panel); border-color:var(--teal); color:var(--teal);}
  .btn:disabled{opacity:0.35;}

  /* PARTY ROW */
  .party-row{display:flex; gap:8px; margin-top:12px;}
  .hero-card{flex:1; background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:8px 7px; position:relative; transition:border-color .15s, box-shadow .15s;}
  .hero-card.active{border-color:var(--ember); box-shadow:0 0 0 1px var(--ember), 0 0 14px rgba(226,121,61,0.35);}
  .hero-card.ready::after{content:'✓'; position:absolute; top:6px; right:6px; color:var(--hp-good); font-size:11px; font-weight:700;}
  .hero-card.dead{opacity:0.3; filter:grayscale(1);}
  .hero-name{font-size:10.5px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hero-class{font-size:8px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:5px;}
  .stat-row{display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:8px; color:var(--text-dim); margin-top:2px;}

  .status-banner{text-align:center; padding:22px 10px; border-radius:10px; background:var(--panel); border:1px solid var(--panel-border); margin-bottom:12px; display:none;}
  .status-banner.show{display:block;}
  .status-banner h2{font-family:'Cinzel',serif; margin:0 0 6px; letter-spacing:0.05em; font-size:20px;}
  .status-banner.victory h2{color:var(--teal);}
  .status-banner.defeat h2{color:var(--blood);}
  .status-banner p{color:var(--text-dim); font-size:12px; margin:0 0 14px;}

  .resolving-note{text-align:center; color:var(--text-dim); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; padding:10px 0; font-family:'Cinzel',serif;}

  .combo-guide{margin-top:16px; padding:10px 12px; background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; font-size:10px; color:var(--text-dim); line-height:1.7;}
  .combo-guide .g-title{color:var(--gold); font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.05em; margin-bottom:6px;}
  .combo-guide code{color:var(--ember); font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body>
<div id="app"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

/* =========================================================================
   DATA MODEL — ported directly from reference/rift-tactics-combat.html
   ========================================================================= */
const DIRS = {H:'High', Lo:'Low', L:'Left', R:'Right'};
const DIR_ICON = {H:'▲', Lo:'▼', L:'◀', R:'▶'};

const ARTS = [
  {seq:['H','H','H'], name:'Meteor Fall', mult:2.3, cost:3},
  {seq:['L','R','L','R'], name:'Flurry Chain', mult:2.1, cost:4},
  {seq:['H','Lo','H'], name:'Rising Tempest', mult:1.85, cost:3},
  {seq:['Lo','Lo'], name:'Ground Break', mult:1.4, cost:2, stun:0.3},
  {seq:['L','R'], name:'Twin Strike', mult:1.45, cost:2},
  {seq:['R','L'], name:'Crosscut', mult:1.45, cost:2},
  {seq:['H','H'], name:'Skyfall Cleave', mult:1.35, cost:2},
];

function makeHero(id,name,cls,hp,ap,speed,power,split,icon){
  return {id,name,cls,maxHp:hp,hp,maxAp:ap,speed,power,split,icon,alive:true,guarding:false,anim:'idle'};
}
function makeEnemy(id,name,tag,hp,atkMin,atkMax,armor,icon,speed){
  return {id,name,tag,maxHp:hp,hp,atkMin,atkMax,armor:armor||0,icon,alive:true,speed,anim:'idle'};
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

let state = {
  phase:'command',
  round:1,
  heroes:[
    makeHero('kael','Kael Ashborn','Blade',130,6,8,12,{H:8,Lo:9,L:10,R:10},'⚔️'),
    makeHero('rin','Rin Vasker','Twinblade',98,7,12,9,{H:6,Lo:6,L:10,R:10},'🗡️'),
    makeHero('mira','Mira Thorncall','Spiritcaller',82,6,7,11,{H:14,Lo:10,L:5,R:5},'🔮'),
  ],
  enemies:[
    makeEnemy('stalker','Ashclaw Stalker','Feral',150,12,19,0,'🐺',11),
    makeEnemy('sentinel','Husk Sentinel','Armored',210,10,16,5,'🛡️',5),
    makeEnemy('wraith','Wraith of the Hollow','Spectral',95,9,15,0,'👻',9),
  ],
  log:[],
  activeHeroIdx:0,
  currentSeq:[],
  selectedTargetId:null,
  pendingActions:{},
  floatQueue:[],
};

function pushLog(html, marker){
  state.log.push({html, marker});
  if(state.log.length>60) state.log.shift();
}

/* ---------- COMBAT LOGIC (ported, unchanged rules) ---------- */
function matchArt(seq){
  const sorted = [...ARTS].sort((a,b)=>b.seq.length-a.seq.length);
  for(const art of sorted){
    if(art.seq.length===seq.length && art.seq.every((d,i)=>d===seq[i])) return art;
  }
  return null;
}
function partialArtHint(seq){
  if(seq.length===0) return null;
  const candidates = ARTS.filter(a=>a.seq.length>seq.length && a.seq.slice(0,seq.length).every((d,i)=>d===seq[i]));
  if(candidates.length===0) return null;
  candidates.sort((a,b)=>a.seq.length-b.seq.length);
  return candidates[0];
}
function calcHeroDamage(hero, seq){
  let base = 0;
  seq.forEach(d=> base += hero.split[d]);
  base += hero.power*0.5;
  const art = matchArt(seq);
  const mult = art ? art.mult : 1.0;
  const variance = 0.9 + Math.random()*0.2;
  const dmg = Math.round(base*mult*variance);
  return {dmg, art};
}
function livingHeroes(){ return state.heroes.filter(h=>h.alive); }
function livingEnemies(){ return state.enemies.filter(e=>e.alive); }

function startRound(){
  state.phase='command';
  state.pendingActions={};
  state.activeHeroIdx = state.heroes.findIndex(h=>h.alive);
  state.currentSeq=[];
  state.selectedTargetId = livingEnemies()[0]?.id || null;
  pushLog(`Round ${state.round}`, true);
  update();
}

function confirmGuard(){
  const hero = state.heroes[state.activeHeroIdx];
  state.pendingActions[hero.id] = {type:'guard'};
  advanceToNextHero();
}
function confirmAttack(){
  const hero = state.heroes[state.activeHeroIdx];
  if(state.currentSeq.length===0) return;
  if(!state.selectedTargetId){ state.selectedTargetId = livingEnemies()[0]?.id; }
  state.pendingActions[hero.id] = {type:'attack', seq:[...state.currentSeq], targetId:state.selectedTargetId};
  advanceToNextHero();
}
function advanceToNextHero(){
  state.currentSeq=[];
  let idx = state.activeHeroIdx+1;
  while(idx < state.heroes.length && !state.heroes[idx].alive) idx++;
  if(idx >= state.heroes.length){
    resolveRound();
  } else {
    state.activeHeroIdx = idx;
    update();
  }
}

function resolveRound(){
  state.phase='resolving';
  update();
  setTimeout(()=>{ runResolution(); }, 400);
}

async function runResolution(){
  const actors = [];
  state.heroes.forEach(h=>{
    if(h.alive && state.pendingActions[h.id]){
      actors.push({type:'hero', ref:h, action:state.pendingActions[h.id], speed:h.speed});
    }
  });
  state.enemies.forEach(e=>{
    if(e.alive){
      actors.push({type:'enemy', ref:e, speed:e.speed});
    }
  });
  actors.sort((a,b)=>b.speed-a.speed);

  for(const actor of actors){
    if(actor.type==='hero'){
      await doHeroAction(actor.ref, actor.action);
    } else if(actor.ref.alive){
      await doEnemyAction(actor.ref);
    }
    checkOver();
    if(state.phase==='over'){ update(); return; }
    await sleep(250);
  }
  finishRound();
}

async function doHeroAction(hero, action){
  if(action.type==='guard'){
    hero.guarding = true;
    hero.anim = 'guard';
    pushLog(`<b>${hero.name}</b> braces defensively.`);
    update();
    await sleep(450);
    return;
  }
  const target = state.enemies.find(e=>e.id===action.targetId && e.alive) || livingEnemies()[0];
  if(!target){ return; }

  hero.anim = 'attack';
  update();
  await sleep(380);

  const {dmg, art} = calcHeroDamage(hero, action.seq);
  const armorReduced = Math.max(1, dmg - target.armor);
  target.hp = Math.max(0, target.hp - armorReduced);
  target.anim = target.hp<=0 ? 'dead' : 'hit';
  state.floatQueue.push({id:target.id, val:armorReduced, kind: art? 'crit':'normal', type:'enemy'});
  if(art){
    pushLog(`<b>${hero.name}</b> unleashes <b style="color:var(--gold)">${art.name}</b> on ${target.name} — ${armorReduced} dmg!`);
  } else {
    pushLog(`<b>${hero.name}</b> strikes ${target.name} for ${armorReduced} dmg.`);
  }
  if(target.hp<=0){
    target.alive=false;
    pushLog(`${target.name} is defeated!`);
  }
  if(art && art.stun && Math.random()<art.stun){
    target.stunned = true;
    pushLog(`${target.name} is staggered!`);
  }
  update();
  await sleep(350);
  hero.anim = 'idle';
  if(target.alive) target.anim = 'idle';
  update();
}

async function doEnemyAction(enemy){
  const targets = livingHeroes();
  if(targets.length===0) return;
  if(enemy.stunned){ enemy.stunned=false; pushLog(`${enemy.name} is staggered and cannot act.`); return; }

  enemy.anim = 'attack';
  update();
  await sleep(300);

  const target = targets[Math.floor(Math.random()*targets.length)];
  let dmg = Math.round(enemy.atkMin + Math.random()*(enemy.atkMax-enemy.atkMin));
  if(target.guarding){ dmg = Math.round(dmg*0.45); }
  target.hp = Math.max(0, target.hp-dmg);
  target.anim = target.hp<=0 ? 'dead' : 'hit';
  state.floatQueue.push({id:target.id, val:dmg, kind:'dmg', type:'hero'});
  pushLog(`${enemy.name} hits <b>${target.name}</b> for ${dmg} dmg.`);
  if(target.hp<=0){ target.alive=false; pushLog(`<b>${target.name}</b> has fallen!`); }
  update();
  await sleep(350);
  enemy.anim = 'idle';
  if(target.alive) target.anim = 'idle';
  update();
}

function finishRound(){
  state.heroes.forEach(h=> h.guarding=false);
  checkOver();
  if(state.phase!=='over'){
    state.round++;
    startRound();
  } else {
    update();
  }
}

function checkOver(){
  if(livingEnemies().length===0){ state.phase='over'; state.result='victory'; }
  else if(livingHeroes().length===0){ state.phase='over'; state.result='defeat'; }
}

/* ---------- INPUT ---------- */
function pressDir(d){
  const hero = state.heroes[state.activeHeroIdx];
  if(state.currentSeq.length>=hero.maxAp) return;
  state.currentSeq.push(d);
  update();
}
function undoDir(){ state.currentSeq.pop(); update(); }
function clearSeq(){ state.currentSeq=[]; update(); }
function selectTarget(id){
  const e = state.enemies.find(x=>x.id===id);
  if(!e || !e.alive) return;
  state.selectedTargetId = id;
  update();
}
function restart(){ location.reload(); }

function hpPct(cur,max){ return Math.max(0,Math.min(100,(cur/max)*100)); }
function hpColor(pct){ if(pct>55) return 'var(--hp-good)'; if(pct>25) return 'var(--hp-mid)'; return 'var(--hp-low)'; }

/* =========================================================================
   3D CHARACTER MODELS — replaces the flat emoji / SVG "sprites" with real,
   lit, low-poly Three.js rigs (rounder capsule/sphere geometry, distinct
   silhouettes per character) driven by the same idle/attack/guard/hit/death
   state machine used by the combat logic above.
   ========================================================================= */

function mat(hex, opts={}){
  const params = Object.assign({color:hex, flatShading:true, roughness:0.7}, opts);
  const m = new THREE.MeshStandardMaterial(params);
  m.userData.baseEmissive = m.emissive.getHex();
  m.userData.baseEmissiveIntensity = m.emissiveIntensity;
  m.userData.baseOpacity = opts.opacity ?? 1;
  return m;
}
function flashMaterials(materials, amt){
  materials.forEach(m=>{
    if(amt>0){ m.emissive.setHex(0xff5544); m.emissiveIntensity = amt; }
    else { m.emissive.setHex(m.userData.baseEmissive); m.emissiveIntensity = m.userData.baseEmissiveIntensity; }
  });
}
function setOpacity(materials, val){
  materials.forEach(m=>{ m.transparent = true; m.opacity = (m.userData.baseOpacity ?? 1) * val; });
}
function resetOpacity(materials){
  materials.forEach(m=>{ const base = m.userData.baseOpacity ?? 1; m.transparent = base<1; m.opacity = base; });
}

function bipedLeg(x, upperMat, lowerMat, bootMat){
  const g = new THREE.Group();
  const thigh = new THREE.Mesh(new THREE.CapsuleGeometry(0.15,0.42,3,6), upperMat); thigh.position.y=-0.3;
  const shin = new THREE.Mesh(new THREE.CapsuleGeometry(0.12,0.4,3,6), lowerMat); shin.position.y=-0.72;
  const bootMesh = new THREE.Mesh(new THREE.BoxGeometry(0.22,0.14,0.3), bootMat); bootMesh.position.set(0,-0.98,0.04);
  g.add(thigh,shin,bootMesh);
  g.position.x = x;
  return g;
}
function makeArmMesh(r, len, upperMat, lowerMat){
  const g = new THREE.Group();
  const upper = new THREE.Mesh(new THREE.CapsuleGeometry(r,len*0.55,3,6), upperMat); upper.position.y = -len*0.28;
  const fore = new THREE.Mesh(new THREE.CapsuleGeometry(r*0.85,len*0.5,3,6), lowerMat); fore.position.y = -len*0.72;
  g.add(upper,fore);
  return g;

/* ---------- POSE FUNCTIONS (per-archetype animation state machine) ---------- */
function poseBiped(m,state,t){
  const {root,torso,head,weaponArm,offArm} = m.parts;
  root.position.set(0,m.baseY,0);
  root.rotation.set(0,0,0);
  torso.position.y = m.baseTorsoY;
  torso.scale.set(1,1,1);
  weaponArm.rotation.set(0,0,0);
  if(offArm) offArm.rotation.set(0,0,0.2);
  flashMaterials(m.materials,0);
  resetOpacity(m.materials);

  if(state==='idle'){
    root.position.y = m.baseY + Math.sin(t*1.8)*(m.heavy?0.015:0.035);
    weaponArm.rotation.x = Math.sin(t*1.8)*0.05 - 0.08;
    if(head) head.rotation.y = Math.sin(t*0.9)*0.1;
  } else if(state==='attack'){
    const p = Math.min(t/(m.heavy?0.7:0.5),1);
    const swing = Math.sin(p*Math.PI);
    weaponArm.rotation.x = -0.3 + swing*2.0;
    weaponArm.rotation.z = swing*0.4;
    root.position.x = swing*(m.heavy?0.06:0.12);
    if(m.dualWield && offArm){
      const p2 = Math.min(Math.max(t-0.08,0)/0.5,1);
      const swing2 = Math.sin(p2*Math.PI);
      offArm.rotation.x = -0.3 + swing2*2.0;
      offArm.rotation.z = -swing2*0.4;
    }
  } else if(state==='guard'){
    torso.scale.set(1,0.92,1);
    torso.position.y = m.baseTorsoY - 0.05;
    weaponArm.rotation.x = -0.6;
    weaponArm.rotation.z = 0.25;
    root.position.y = m.baseY - 0.08;
  } else if(state==='hit'){
    const p = Math.min(t/0.35,1);
    const decay = 1-p;
    root.position.x = Math.sin(t*45)*0.08*decay;
    flashMaterials(m.materials, Math.max(0,1-p)*0.8);
  } else if(state==='dead'){
    const p = Math.min(t/0.8,1);
    const e = 1-Math.pow(1-p,3);
    root.rotation.z = e*1.3;
    root.position.y = m.baseY - e*0.4;
    setOpacity(m.materials, 1-e*0.85);
  }
}

function poseQuadruped(m,state,t){
  const {root, body, head, legFL, legFR, legBL, legBR, tail} = m.parts;
  root.position.set(0,0,0);
  root.rotation.set(0,0,0);
  body.position.set(0,0.42,0);
  head.rotation.set(0,0,0);
  [legFL,legFR,legBL,legBR].forEach(l=>l.rotation.set(0,0,0));
  tail.rotation.set(-Math.PI/2.4,0,0);
  flashMaterials(m.materials,0);
  resetOpacity(m.materials);

  if(state==='idle'){
    body.position.y = 0.42 + Math.sin(t*2)*0.02;
    tail.rotation.z = Math.sin(t*2.4)*0.15;
    head.rotation.x = Math.sin(t*2)*0.03;
  } else if(state==='attack'){
    const p = Math.min(t/0.45,1);
    const lunge = Math.sin(p*Math.PI);
    root.position.z = lunge*0.5;
    head.rotation.x = -lunge*0.3;
    legFL.rotation.x = -lunge*0.5; legFR.rotation.x = -lunge*0.5;
    legBL.rotation.x = lunge*0.4; legBR.rotation.x = lunge*0.4;
  } else if(state==='guard'){
    body.position.y = 0.34;
    root.position.y = -0.06;
    tail.rotation.x = -Math.PI/1.8;
  } else if(state==='hit'){
    const p = Math.min(t/0.35,1);
    const decay = 1-p;
    root.position.x = Math.sin(t*45)*0.08*decay;
    flashMaterials(m.materials, Math.max(0,1-p)*0.8);
  } else if(state==='dead'){
    const p = Math.min(t/0.8,1);
    const e = 1-Math.pow(1-p,3);
    root.rotation.z = e*1.4;
    root.position.y = -e*0.3;
    setOpacity(m.materials, 1-e*0.85);
  }
}

function poseWraith(m,state,t){
  const {root, body, head, armL, armR} = m.parts;
  root.position.set(0,0,0);
  root.rotation.set(0,0,0);
  root.scale.setScalar(0.95);
  armL.rotation.set(0,0,0.3);
  armR.rotation.set(0,0,-0.3);
  body.rotation.set(0,0,0);
  flashMaterials(m.materials,0);
  resetOpacity(m.materials);

  if(state==='idle'){
    root.position.y = 0.06*Math.sin(t*1.4);
    root.rotation.y = Math.sin(t*0.6)*0.15;
    body.rotation.z = Math.sin(t*1.2)*0.05;
    const pulse = 0.7 + 0.25*Math.sin(t*3);
    setOpacity(m.materials, pulse);
  } else if(state==='attack'){
    const p = Math.min(t/0.45,1);
    const lunge = Math.sin(p*Math.PI);
    root.position.z = lunge*0.35;
    armL.rotation.x = -lunge*1.6;
    armR.rotation.x = -lunge*1.6;
    head.rotation.x = -lunge*0.2;
  } else if(state==='guard'){
    armL.rotation.set(0,0,1.1);
    armR.rotation.set(0,0,-1.1);
    root.scale.setScalar(0.85);
  } else if(state==='hit'){
    const p = Math.min(t/0.3,1);
    const decay = 1-p;
    root.position.x = Math.sin(t*50)*0.09*decay;
    flashMaterials(m.materials, Math.max(0,1-p)*0.9);
  } else if(state==='dead'){
    const p = Math.min(t/0.7,1);
    const e = 1-Math.pow(1-p,3);
    root.scale.setScalar(0.95*(1-e*0.9));
    root.position.y = e*0.4;
    setOpacity(m.materials, (1-e)*0.6);
  }
}

const POSE_FNS = {biped:poseBiped, quadruped:poseQuadruped, wraith:poseWraith};

/* arena position: x/z placement on the battlefield, groundY lifts each rig so
   its feet/base rest on the dungeon floor (rigs were modeled around their own
   local origin, so this varies per silhouette), scale balances their relative
   sizes now that they share one camera instead of individually-framed shots */
const CHAR_CONFIG = {
  kael:     {build:buildKael,     archetype:'biped',     isEnemy:false, arena:{x:-1.0,  z:1.0,  groundY:1.02, scale:1.0 }},
  rin:      {build:buildRin,      archetype:'biped',     isEnemy:false, arena:{x:0,     z:1.15, groundY:0.95, scale:1.05}},
  mira:     {build:buildMira,     archetype:'biped',     isEnemy:false, arena:{x:1.0,   z:1.0,  groundY:0.35, scale:1.05}},
  stalker:  {build:buildStalker,  archetype:'quadruped', isEnemy:true,  arena:{x:-1.7,  z:-1.3, groundY:0.29, scale:1.15}},
  sentinel: {build:buildSentinel, archetype:'biped',     isEnemy:true,  arena:{x:0,     z:-1.5, groundY:0.98, scale:1.1 }},
  wraith:   {build:buildWraith,   archetype:'wraith',    isEnemy:true,  arena:{x:1.7,   z:-1.3, groundY:0.55, scale:1.1 }},
};

const modelRegistry = {};
let arena = null;

function shadeColor(hex, factor){
  const c = new THREE.Color(hex);
  c.multiplyScalar(factor);
  return '#' + c.getHexString();
}
function makeStoneTexture(size, baseColor, jointColor, cols, rows){
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = size;
  const ctx = cvs.getContext('2d');
  ctx.fillStyle = jointColor;
  ctx.fillRect(0,0,size,size);
  const cw = size/cols, ch = size/rows;
  for(let r=0;r<rows;r++){
    const offset = (r%2)*cw*0.5;
    for(let c=-1;c<=cols;c++){
      const x = c*cw + offset, y = r*ch;
      ctx.fillStyle = shadeColor(baseColor, 0.8 + Math.random()*0.35);
      ctx.fillRect(x+2, y+2, cw-4, ch-4);
    }
  }
  const tex = new THREE.CanvasTexture(cvs);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function buildDungeonEnvironment(scene){
  scene.fog = new THREE.FogExp2(0x14111c, 0.09);

  const floorTex = makeStoneTexture(256, 0x3a3342, 0x18141e, 6, 6);
  floorTex.repeat.set(7,5);
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(18,11),
    new THREE.MeshStandardMaterial({map:floorTex, roughness:0.95})
  );
  floor.rotation.x = -Math.PI/2;
  scene.add(floor);

  const wallTex = makeStoneTexture(256, 0x2a2436, 0x120f18, 7, 4);
  wallTex.repeat.set(8,3);
  const wall = new THREE.Mesh(
    new THREE.PlaneGeometry(18,7),
    new THREE.MeshStandardMaterial({map:wallTex, roughness:0.95})
  );
  wall.position.set(0,3.1,-3.1);
  scene.add(wall);

  const archway = new THREE.Mesh(
    new THREE.PlaneGeometry(2.1,3.6),
    new THREE.MeshStandardMaterial({color:0x07050a, roughness:1})
  );
  archway.position.set(0,1.75,-3.05);
  scene.add(archway);

  const pillarTex = makeStoneTexture(128, 0x352e40, 0x161320, 2, 8);
  pillarTex.repeat.set(1,4);
  function pillar(x){
    const p = new THREE.Mesh(
      new THREE.CylinderGeometry(0.34,0.4,3.6,10),
      new THREE.MeshStandardMaterial({map:pillarTex, roughness:0.9})
    );
    p.position.set(x,1.8,-1.4);
    scene.add(p);
  }
  pillar(-2.7); pillar(2.7);

  const torchLights = [];
  function torch(x){
    const bracket = new THREE.Mesh(
      new THREE.CylinderGeometry(0.04,0.05,0.3,6),
      new THREE.MeshStandardMaterial({color:0x1a1512, roughness:0.8})
    );
    bracket.position.set(x,2.15,-1.05);
    bracket.rotation.z = Math.PI/2.4;
    scene.add(bracket);

    const flame = new THREE.Mesh(
      new THREE.ConeGeometry(0.09,0.24,6),
      new THREE.MeshStandardMaterial({color:0xffb15c, emissive:0xe2793d, emissiveIntensity:1.6, roughness:0.4})
    );
    flame.position.set(x,2.34,-0.95);
    scene.add(flame);

    const light = new THREE.PointLight(0xff9448, 1.2, 5.5, 2);
    light.position.set(x,2.3,-0.9);
    scene.add(light);
    torchLights.push(light);
  }
  torch(-2.7); torch(2.7);

  return {torchLights};
}

function createArena(container){
  const scene = new THREE.Scene();
  const w = container.clientWidth || 480, h = container.clientHeight || 300;
  const camera = new THREE.PerspectiveCamera(34, w/h, 0.1, 30);
  camera.position.set(0, 1.5, 5.1);
  camera.lookAt(0, 1.15, -0.7);

  scene.add(new THREE.AmbientLight(0x4a3f5c, 0.6));
  const key = new THREE.DirectionalLight(0xffb27a, 1.05); key.position.set(3,5,4); scene.add(key);
  const rim = new THREE.DirectionalLight(0x4fd1c0, 0.3); rim.position.set(-4,3,-3); scene.add(rim);

  const {torchLights} = buildDungeonEnvironment(scene);

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(w,h);
  container.appendChild(renderer.domElement);

  return {scene, camera, renderer, torchLights};
}

function createArenaModel(id, scene){
  const cfg = CHAR_CONFIG[id];
  const anchor = new THREE.Group();
  anchor.position.set(cfg.arena.x, cfg.arena.groundY, cfg.arena.z);

  const built = cfg.build();
  built.group.scale.multiplyScalar(cfg.arena.scale ?? 1);
  anchor.add(built.group);

  let ring = null;
  if(cfg.isEnemy){
    ring = new THREE.Mesh(
      new THREE.RingGeometry(0.5,0.62,28),
      new THREE.MeshBasicMaterial({color:0xd2495a, transparent:true, opacity:0.9, side:THREE.DoubleSide})
    );
    ring.rotation.x = -Math.PI/2;
    ring.position.y = 0.02 - cfg.arena.groundY;
    ring.visible = false;
    anchor.add(ring);
  }

  scene.add(anchor);
  modelRegistry[id] = Object.assign(
    {anchor, ring, animState:'idle', animStart:performance.now(), archetype:cfg.archetype},
    built
  );
}

function animateModels(now){
  requestAnimationFrame(animateModels);
  if(!arena) return;
  arena.torchLights.forEach((l,i)=>{
    l.intensity = 1.15 + Math.sin(now*0.006 + i*2.1)*0.15 + (Math.random()-0.5)*0.06;
  });
  Object.values(modelRegistry).forEach(m=>{
    const t = (now - m.animStart)/1000;
    POSE_FNS[m.archetype](m, m.animState, t);
  });
  arena.renderer.render(arena.scene, arena.camera);
}
requestAnimationFrame(animateModels);

/* =========================================================================
   DOM — built once, then patched in place (never innerHTML-replaced) so the
   live WebGL canvas is never destroyed/recreated.
   ========================================================================= */
function buildLayout(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="title">RIFT TACTICS</div>
    <div class="subtitle">Combat Prototype · <span id="round-label"></span></div>
    <div class="log-box" id="logbox"></div>
    <div class="arena-wrap" id="arena-wrap"></div>
    <div id="status-banner" class="status-banner"></div>
    <div class="enemy-row" id="enemy-row"></div>
    <div class="rule"></div>
    <div class="party-row" id="party-row"></div>
    <div id="command-area"></div>
    <div class="combo-guide">
      <div class="g-title">Known Arts</div>
      ${ARTS.map(a=>`<div>${a.seq.map(d=>DIR_ICON[d]).join(' ')} — <code>${a.name}</code> (×${a.mult})</div>`).join('')}
    </div>
  `;

  arena = createArena(document.getElementById('arena-wrap'));
  state.enemies.forEach(e=> createArenaModel(e.id, arena.scene));
  state.heroes.forEach(h=> createArenaModel(h.id, arena.scene));

  const enemyRow = document.getElementById('enemy-row');
  state.enemies.forEach(e=>{
    const card = document.createElement('div');
    card.className = 'enemy-card targetable';
    card.dataset.eid = e.id;
    card.addEventListener('click', ()=>selectTarget(e.id));
    card.innerHTML = `
      <div class="enemy-tag">${e.tag}</div>
      <div class="enemy-name">${e.name}</div>
      <div class="hpbar-wrap"><div class="hpbar" id="hp-${e.id}"></div></div>
      <div class="hptext" id="hpt-${e.id}"></div>
    `;
    enemyRow.appendChild(card);
  });

  const partyRow = document.getElementById('party-row');
  state.heroes.forEach(h=>{
    const card = document.createElement('div');
    card.className = 'hero-card';
    card.dataset.hid = h.id;
    card.innerHTML = `
      <div class="hero-name">${h.name}</div>
      <div class="hero-class">${h.cls}</div>
      <div class="hpbar-wrap"><div class="hpbar" id="hp-${h.id}"></div></div>
      <div class="stat-row"><span id="hpt-${h.id}"></span><span>AP ${h.maxAp}</span></div>
    `;
    partyRow.appendChild(card);
  });
}

function update(){
  document.getElementById('round-label').textContent = `Round ${state.round}`;

  [...state.heroes, ...state.enemies].forEach(ent=>{
    const m = modelRegistry[ent.id];
    const anim = ent.anim || 'idle';
    if(m && m.animState !== anim){
      m.animState = anim;
      m.animStart = performance.now();
    }
  });

  state.enemies.forEach(e=>{
    const card = document.querySelector(`.enemy-card[data-eid="${e.id}"]`);
    const pct = hpPct(e.hp,e.maxHp);
    card.classList.toggle('dead', !e.alive);
    card.classList.toggle('targetable', e.alive);
    card.classList.toggle('selected', state.selectedTargetId===e.id);
    const m = modelRegistry[e.id];
    if(m && m.ring) m.ring.visible = e.alive && state.selectedTargetId===e.id;
    document.getElementById(`hp-${e.id}`).style.width = pct+'%';
    document.getElementById(`hp-${e.id}`).style.background = hpColor(pct);
    document.getElementById(`hpt-${e.id}`).textContent = `${e.hp}/${e.maxHp}`;
  });

  state.heroes.forEach((h,idx)=>{
    const card = document.querySelector(`.hero-card[data-hid="${h.id}"]`);
    const pct = hpPct(h.hp,h.maxHp);
    card.classList.toggle('active', state.phase==='command' && idx===state.activeHeroIdx);
    card.classList.toggle('ready', !!state.pendingActions[h.id]);
    card.classList.toggle('dead', !h.alive);
    document.getElementById(`hp-${h.id}`).style.width = pct+'%';
    document.getElementById(`hp-${h.id}`).style.background = hpColor(pct);
    document.getElementById(`hpt-${h.id}`).textContent = `${h.hp}/${h.maxHp}`;
  });

  const logHtml = state.log.slice(-14).map(l=> l.marker ? `<div class="entry turn-marker">— ${l.html} —</div>` : `<div class="entry">${l.html}</div>`).join('');
  const lb = document.getElementById('logbox');
  lb.innerHTML = logHtml;
  lb.scrollTop = lb.scrollHeight;

  const banner = document.getElementById('status-banner');
  if(state.phase==='over'){
    const won = state.result==='victory';
    banner.className = 'status-banner show '+(won?'victory':'defeat');
    banner.innerHTML = `<h2>${won?'VICTORY':'PARTY DEFEATED'}</h2><p>${won?"The Rift recoils. Your heroes stand over the wreckage of its spawn.":"The Ashclaw Stalker's pack drags your heroes into the mist..."}</p><button class="btn primary" style="max-width:200px;margin:0 auto;" id="btn-restart">Fight Again</button>`;
    document.getElementById('btn-restart').onclick = restart;
  } else {
    banner.className = 'status-banner';
    banner.innerHTML = '';
  }

  const commandArea = document.getElementById('command-area');
  if(state.phase==='command'){
    const hero = state.heroes[state.activeHeroIdx];
    const seq = state.currentSeq;
    const art = matchArt(seq);
    const hint = partialArtHint(seq);
    const beads = seq.length===0
      ? `<div class="thread-empty">Input a combo…</div>`
      : seq.map(d=>`<div class="thread-bead filled">${DIR_ICON[d]}</div>`).join('');
    const calloutText = art ? art.name : (hint ? `→ ${hint.name}?` : (seq.length? 'Unnamed strike' : ''));
    commandArea.innerHTML = `
      <div class="thread-wrap">
        <div class="thread-label">
          <span class="who">${hero.icon} ${hero.name}</span>
          <span class="ap">AP ${seq.length}/${hero.maxAp}</span>
        </div>
        <div class="thread-line">${beads}</div>
        <div class="art-callout">${calloutText||'&nbsp;'}</div>
        <div class="art-hint">${hero.cls} · Target: ${state.enemies.find(e=>e.id===state.selectedTargetId)?.name || '—'}</div>
      </div>
      <div class="pad-grid">
        <button class="pad-btn high" id="pad-H">${DIR_ICON.H}</button>
        <div></div>
        <button class="pad-btn left" id="pad-L">${DIR_ICON.L}</button>
        <button class="pad-btn center" id="pad-undo">UNDO</button>
        <button class="pad-btn right" id="pad-R">${DIR_ICON.R}</button>
        <div></div>
        <button class="pad-btn low" id="pad-Lo">${DIR_ICON.Lo}</button>
        <div></div>
      </div>
      <div class="action-row">
        <button class="btn ghost" id="btn-clear">Clear</button>
        <button class="btn guard" id="btn-guard">Guard</button>
        <button class="btn primary" id="btn-confirm" ${seq.length===0?'disabled':''}>Confirm</button>
      </div>
    `;
    document.getElementById('pad-H').onclick = ()=>pressDir('H');
    document.getElementById('pad-L').onclick = ()=>pressDir('L');
    document.getElementById('pad-R').onclick = ()=>pressDir('R');
    document.getElementById('pad-Lo').onclick = ()=>pressDir('Lo');
    document.getElementById('pad-undo').onclick = undoDir;
    document.getElementById('btn-clear').onclick = clearSeq;
    document.getElementById('btn-guard').onclick = confirmGuard;
    document.getElementById('btn-confirm').onclick = confirmAttack;
  } else if(state.phase==='resolving'){
    commandArea.innerHTML = `<div class="resolving-note">⚔ Resolving Round ${state.round} ⚔</div>`;
  } else {
    commandArea.innerHTML = '';
  }

  if(state.floatQueue.length){
    const queued = state.floatQueue; state.floatQueue = [];
    requestAnimationFrame(()=>{
      queued.forEach(f=>{
        const host = f.type==='hero'
          ? document.querySelector(`.hero-card[data-hid="${f.id}"]`)
          : document.querySelector(`.enemy-card[data-eid="${f.id}"]`);
        if(!host) return;
        const el = document.createElement('div');
        el.className = 'dmg-float' + (f.kind==='crit' ? ' crit' : '');
        el.textContent = '-'+f.val;
        host.appendChild(el);
        setTimeout(()=>el.remove(), 900);
      });
    });
  }
}

buildLayout();
pushLog('The Rift tears open. Three horrors emerge.', true);
update();
</script>
